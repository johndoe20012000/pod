name: Fork package (macOS)

# Fork-only workflow, not for upstream. It builds the macOS app from this branch and
# uploads it as an artifact of the run (Actions > the run > Artifacts).
#
# Same build and packaging commands as scripts/package, with a lean setup (only Rust
# and cargo-packager). No secret is used: the app is ad-hoc signed only, and with no
# PACKAGER_PUBLIC_KEY or POD_TELEMETRY_KEY at build time its updater and telemetry are off.
#
# The release build of the pod crate is slow on the standard macOS runner (3 cores,
# 7 GB), so the same target is also built on the Intel runner (4 cores, 14 GB), which
# cross-compiles it. Whichever leg finishes first is the one to use.

on:
  push:
    branches:
      - fork-package-mac
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  # Item icons generated by run 43346896014 of fork-package.yml (kept for 3 days).
  ICONS_RUN_ID: "43346896014"
  RUST_VERSION: "1.96.0"
  PACKAGER_VERSION: "0.11.8"

jobs:
  package:
    name: ${{ matrix.target }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: aarch64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - name: Download item icons
        uses: actions/download-artifact@v8
        with:
          name: item-images
          path: assets/images/items
          run-id: ${{ env.ICONS_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Install Rust and cargo-packager
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target ${{ matrix.target }}
          rustup default "$RUST_VERSION"
          cargo install cargo-packager --version "$PACKAGER_VERSION" --locked

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package the app
        run: |
          cargo-packager --release --formats app --target ${{ matrix.target }}
          APP=$(find "target/${{ matrix.target }}/release" -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "Pod-${{ matrix.target }}.app.zip"

      - name: Upload the app
        uses: actions/upload-artifact@v7
        with:
          name: pod-macos-${{ matrix.target }}-app-built-on-${{ matrix.runner }}
          if-no-files-found: error
          retention-days: 30
          path: Pod-${{ matrix.target }}.app.zip

      - name: Package the dmg (best effort)
        continue-on-error: true
        timeout-minutes: 20
        run: cargo-packager --release --formats dmg --target ${{ matrix.target }}

      - name: Upload the dmg
        uses: actions/upload-artifact@v7
        with:
          name: pod-macos-${{ matrix.target }}-dmg-built-on-${{ matrix.runner }}
          if-no-files-found: ignore
          retention-days: 30
          path: target/${{ matrix.target }}/release/*.dmg
