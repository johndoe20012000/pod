[env]
# Sized for the generated function that rust-i18n's `i18n!` macro used to fill with every locale
# (~31k strings): its debug-build frame overflowed the default 2 MB stack of a libtest worker thread
# under coverage (Linux) or the smaller effective stack (Windows). `EmbeddedLocales` replaced that
# function, so the original reason is gone; the generous stack for test threads (and rustc) is kept
# until the suite has been run under coverage on every platform without it.
RUST_MIN_STACK = { value = "16777216", force = true }
